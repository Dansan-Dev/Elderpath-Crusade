[compileJava, compileTestJava]*.options*.encoding = 'UTF-8'
eclipse.project.name = appName + '-core'

dependencies {
  api "com.badlogicgames.box2dlights:box2dlights:$box2dlightsVersion"
  api "com.badlogicgames.gdx:gdx-ai:$aiVersion"
  api "com.badlogicgames.ashley:ashley:1.7.4"
  api "com.badlogicgames.gdx:gdx-box2d:$gdxVersion"
  api "com.badlogicgames.gdx:gdx-freetype:$gdxVersion"
  api "com.badlogicgames.gdx:gdx:$gdxVersion"
  implementation 'org.yaml:snakeyaml:2.2'
  implementation 'com.fasterxml.jackson.core:jackson-databind:2.16.1'

  testImplementation 'org.junit.jupiter:junit-jupiter:5.10.2'
  testImplementation 'org.mockito:mockito-core:5.11.0'
  testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

  if(enableGraalNative == 'true') {
    implementation "io.github.berstanio:gdx-svmhelper-annotations:$graalHelperVersion"
  }
}

test {
  useJUnitPlatform()
  // Pass testProfile to tests so AssetsCondition can gate asset-dependent tests.
  // Values: "local" (run all), "cloud" (skip asset tests), absent (auto-detect).
  // Override: ./gradlew :core:test -PtestProfile=local
  if (project.hasProperty('testProfile')) {
    systemProperty 'testProfile', project.testProfile
  }
}
