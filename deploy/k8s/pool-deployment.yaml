# A pool of generically-available match servers, each defaulting to one human vs. SmartBot.
# This is the ONE use case a plain Deployment+Service+HPA correctly serves without a
# matchmaking layer: no client needs to be routed to a *specific* pod, because every pod runs
# the same kind of match and any ready one will do (ServerLauncher's existing one-match-per-
# process lifecycle — the process exits after the match ends or sits idle too long, see
# ServerLauncher — means a pod that just finished a match restarts fresh for the next one;
# Kubernetes' normal Pod restart behavior IS this project's job-per-match model, for this
# pairing-free case). It does NOT support two specific humans finding each other — see
# ../README.md and job-template.yaml for why, and FEAT-008's remaining phases for the
# matchmaking/lobby/reconnect layer that would add that.
#
# Sized for Oracle Cloud's "Always Free" tier (OKE Basic cluster + Ampere A1 ARM compute) — see
# ../README.md's "Deploying to Oracle Cloud (OKE, Always Free)" section before applying this.
# The whole tenancy's free ARM allocation is 2 OCPU / 12 GB RAM (cut down from 4/24 in 2026),
# shared across however many worker-node VMs the free node pool is split into, and the control
# plane/CNI/kube-proxy/etc. already use some of that before any workload runs — the numbers
# below (minReplicas/maxReplicas/resources) are deliberately conservative so a 2-replica steady
# state plus some burst room actually fits, not a guess at real production traffic.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: elderpath-server-pool
  namespace: elderpath
  labels:
    app: elderpath-server
spec:
  replicas: 1 # the HPA below takes over from here; matches its minReplicas
  selector:
    matchLabels:
      app: elderpath-server
  template:
    metadata:
      labels:
        app: elderpath-server
    spec:
      # Always Free worker nodes are Ampere A1 (aarch64) — pin pods to arm64 explicitly so a
      # scheduling mistake fails loudly instead of landing on some other node's wrong-arch image
      # pull. Build/push the image for linux/arm64 (see ../README.md) or this never schedules.
      nodeSelector:
        kubernetes.io/arch: arm64
      # Only needed for a private OCIR repository — a public one (Container Registry > repo >
      # Repository Visibility in the OCI console) needs no secret at all. See ../README.md.
      # imagePullSecrets:
      #   - name: ocir-pull-secret
      containers:
        - name: elderpath-server
          # Build with deploy/server/Dockerfile for linux/arm64 and push to OCIR (Oracle's
          # container registry) or any registry this cluster can pull from — replace this
          # placeholder first. OCIR format: <region-key>.ocir.io/<tenancy-namespace>/<repo>:<tag>
          # (e.g. iad.ocir.io/axxxxxxxxxxxx/elderpath-server:latest). A public OCIR repo needs no
          # imagePullSecrets; a private one does — see ../README.md.
          image: your-registry/elderpath-server:latest
          ports:
            - name: game
              containerPort: 4567
            - name: health
              containerPort: 8080
          args:
            - "--bind"
            - "0.0.0.0"
            - "--port"
            - "4567"
            - "--assets"
            - "assets"
            - "--health-port"
            - "8080"
            # One human vs. a SmartBot — adjust deck/bot kind/seed here for a different pool flavor.
            - "--p2"
            - "smart"
            # Generous: give a player time to find this pod (through the Service below) before
            # an unused instance recycles. Kubernetes restarts the Pod immediately either way.
            - "--idle-timeout-s"
            - "180"
          # Startup can take a few seconds (JVM boot + loading pieces/abilities/spells yaml);
          # startupProbe holds off the liveness probe until the process is actually ticking.
          startupProbe:
            httpGet:
              path: /healthz/live
              port: health
            failureThreshold: 30
            periodSeconds: 1
          livenessProbe:
            httpGet:
              path: /healthz/live
              port: health
            periodSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /healthz/ready
              port: health
            periodSeconds: 5
            failureThreshold: 2
          # Trimmed for the Always Free ARM allocation (2 OCPU / 12 GB total, minus whatever the
          # node pool's own system pods use) rather than the earlier, more generous guess —
          # scaled up to the HPA's maxReplicas (4) below, that's ~800m CPU / ~768Mi memory total,
          # leaving headroom under 2 OCPU/12GB even accounting for cluster system pods.
          # No -Xmx is set anywhere (see server/launcher/ServerLauncher) — the JVM sizes its heap
          # from this container's own memory limit automatically (container-aware default
          # MaxRAMPercentage since Java 10+), so raising/lowering `limits.memory` directly changes
          # how much heap each match server gets.
          resources:
            requests:
              cpu: 200m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 384Mi
---
# Game-port only — health checks are read directly from each Pod's IP by kubelet, not routed
# through the Service. LoadBalancer, since the whole point of this pool is to take real internet
# connections directly (no matchmaking layer in front of it) — the annotations below pin OCI's
# load balancer to the flexible shape at its lowest bandwidth (10 Mbps), which is what Always
# Free's one included load balancer covers; **verify that bandwidth figure against your own OCI
# console/billing before relying on it** — it's a long-standing, stable Always Free detail, but
# this manifest can't see your tenancy's actual entitlements, and a wrong shape here is the one
# part of this whole deployment that could actually cost money if it defaulted to something else.
apiVersion: v1
kind: Service
metadata:
  name: elderpath-server-pool
  namespace: elderpath
  annotations:
    service.beta.kubernetes.io/oci-load-balancer-shape: "flexible"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-min: "10"
    service.beta.kubernetes.io/oci-load-balancer-shape-flex-max: "10"
spec:
  selector:
    app: elderpath-server
  ports:
    - name: game
      port: 4567
      targetPort: game
  type: LoadBalancer
---
# Scales on CPU — trimmed to fit the Always Free ARM allocation rather than a real measured
# load (2 OCPU/12GB total for the whole tenancy; see the Deployment's own comment above for the
# arithmetic). Raise these once this runs on anything bigger than the free tier.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: elderpath-server-pool
  namespace: elderpath
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: elderpath-server-pool
  minReplicas: 1
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
