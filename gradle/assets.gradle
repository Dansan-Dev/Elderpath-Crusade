// Moves the gitignored game assets between machines.
//
//   ./gradlew exportAssets                      -> build/asset-bundles/elderpath-assets-<time>.zip
//   ./gradlew exportAssets -Pout=/tmp/a.zip     -> that file instead
//   ./gradlew importAssets -Pzip=/tmp/a.zip     -> verify, then unpack into this checkout
//
// Import options: -PdryRun=true (verify and report, write nothing), -Pforce=true (overwrite files that
// already exist with different content; the old ones are first moved to build/asset-import-backup/<time>/).
// -PassetsRoot=<dir> uses another directory as the project root (tests, odd layouts).
//
// What is in a bundle: everything the build needs that git does not hold — see ROOTS. A bundle carries an
// ASSETS-MANIFEST.txt with a SHA-256 and size per file; import verifies every file against it before it
// writes anything, refuses entries outside ROOTS (no "..", no absolute paths, no links out of the checkout),
// and never deletes a file that is not in the bundle.

import java.nio.file.Files
import java.nio.file.Path
import java.nio.file.StandardCopyOption
import java.security.MessageDigest
import java.text.SimpleDateFormat
import java.util.zip.ZipEntry
import java.util.zip.ZipFile
import java.util.zip.ZipOutputStream

class AssetBundle {
    static final String MANIFEST = 'ASSETS-MANIFEST.txt'
    static final String FORMAT = 'elderpath-assets 1'
    // Relative to the project root. Mirrors .gitignore's assets/*, lwjgl3/icons/*, lwjgl3/src/main/resources/*.
    static final List<String> ROOTS = ['assets', 'lwjgl3/icons', 'lwjgl3/src/main/resources']

    static class Entry {
        String path; String sha256; long size
    }

    /** Generated or junk files that never belong in a bundle. */
    static boolean excluded(String rel) {
        String name = rel.substring(rel.lastIndexOf('/') + 1)
        return rel == 'assets/assets.txt'            // regenerated by the build (generateAssetList)
            || name.endsWith(':Zone.Identifier')     // Windows download marks that WSL copies leave behind
            || name == '.DS_Store' || name == 'Thumbs.db'
    }

    static String sha256(InputStream input) {
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        byte[] buffer = new byte[65536]
        int n
        while ((n = input.read(buffer)) > 0) digest.update(buffer, 0, n)
        return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
    }

    static String sha256(Path file) {
        file.withInputStream { sha256(it) }
    }

    /** Throws unless the zip entry name is a plain relative path inside one of ROOTS. */
    static String checkedName(String name) {
        if (name == null || name.isEmpty()) throw new GradleException('A bundle entry has an empty name')
        if (name.contains('\\') || name.startsWith('/') || name ==~ /^[A-Za-z]:.*/ || name.contains('\u0000')) {
            throw new GradleException("Refusing bundle entry with an unsafe path: ${name}")
        }
        for (String segment : name.split('/', -1)) {
            if (segment.isEmpty() || segment == '.' || segment == '..') {
                throw new GradleException("Refusing bundle entry with an unsafe path: ${name}")
            }
        }
        if (!ROOTS.any { name.startsWith(it + '/') }) {
            throw new GradleException("Refusing bundle entry outside the asset folders (${ROOTS.join(', ')}): ${name}")
        }
        return name
    }

    static List<Entry> collect(File root) {
        List<Entry> entries = []
        Path rootPath = root.toPath()
        for (String dir : ROOTS) {
            Path base = rootPath.resolve(dir)
            if (!Files.isDirectory(base)) continue
            Files.walk(base).withCloseable { stream ->
                stream.filter { Files.isRegularFile(it) }.each { Path file ->
                    String rel = rootPath.relativize(file).toString().replace(File.separatorChar, '/' as char)
                    if (excluded(rel)) return
                    entries << new Entry(path: rel, sha256: sha256(file), size: Files.size(file))
                }
            }
        }
        entries.sort { it.path }
        return entries
    }

    static int export(File root, File zipOut, String commit) {
        List<Entry> entries = collect(root)
        if (entries.isEmpty()) {
            throw new GradleException("No asset files found under ${root} (looked in ${ROOTS.join(', ')}) — " +
                'run this on the machine that holds the real assets')
        }
        if (!new File(root, 'assets/data/pieces.yaml').isFile()) {
            println 'WARNING: assets/data/pieces.yaml is missing — this does not look like a complete asset folder'
        }
        zipOut.parentFile?.mkdirs()
        File temp = new File(zipOut.parentFile ?: new File('.'), zipOut.name + '.part')
        new ZipOutputStream(new BufferedOutputStream(new FileOutputStream(temp))).withCloseable { zip ->
            entries.each { Entry e ->
                zip.putNextEntry(new ZipEntry(e.path))
                Files.copy(root.toPath().resolve(e.path), zip)
                zip.closeEntry()
            }
            StringBuilder manifest = new StringBuilder()
            manifest << FORMAT << '\n'
            manifest << 'created: ' << new SimpleDateFormat("yyyy-MM-dd'T'HH:mm:ssZ").format(new Date()) << '\n'
            manifest << 'source-commit: ' << commit << '\n'
            manifest << 'files: ' << entries.size() << '\n'
            entries.each { manifest << it.sha256 << '  ' << it.size << '  ' << it.path << '\n' }
            zip.putNextEntry(new ZipEntry(MANIFEST))
            zip.write(manifest.toString().getBytes('UTF-8'))
            zip.closeEntry()
        }
        Files.move(temp.toPath(), zipOut.toPath(), StandardCopyOption.REPLACE_EXISTING)
        return entries.size()
    }

    static List<Entry> readManifest(ZipFile zip) {
        ZipEntry manifestEntry = zip.getEntry(MANIFEST)
        if (manifestEntry == null) throw new GradleException("Not an Elderpath asset bundle: no ${MANIFEST}")
        List<String> lines = zip.getInputStream(manifestEntry).getText('UTF-8').readLines()
        if (lines.isEmpty() || lines[0] != FORMAT) {
            throw new GradleException("Unsupported bundle format '${lines ? lines[0] : ''}' (this tool reads '${FORMAT}')")
        }
        List<Entry> entries = []
        Set<String> seen = new HashSet<>()
        lines.drop(1).each { String line ->
            def m = line =~ /^([0-9a-f]{64})  (\d+)  (.+)$/
            if (!m.matches()) return // header lines (created:, source-commit:, files:)
            Entry e = new Entry(sha256: m.group(1), size: Long.parseLong(m.group(2)), path: checkedName(m.group(3)))
            if (!seen.add(e.path)) throw new GradleException("Bundle lists ${e.path} twice")
            entries << e
        }
        return entries
    }

    /** Streams one entry, refusing more bytes than the manifest declares; returns its SHA-256. */
    static String hashEntry(ZipFile zip, ZipEntry zipEntry, long declaredSize, OutputStream sink = null) {
        MessageDigest digest = MessageDigest.getInstance('SHA-256')
        byte[] buffer = new byte[65536]
        long total = 0
        zip.getInputStream(zipEntry).withCloseable { input ->
            int n
            while ((n = input.read(buffer)) > 0) {
                total += n
                if (total > declaredSize) throw new GradleException("${zipEntry.name} is larger than its manifest entry")
                digest.update(buffer, 0, n)
                if (sink != null) sink.write(buffer, 0, n)
            }
        }
        if (total != declaredSize) throw new GradleException("${zipEntry.name} is smaller than its manifest entry")
        return digest.digest().collect { String.format('%02x', it & 0xff) }.join()
    }

    /** Returns [new, unchanged, replaced] counts. */
    static List<Integer> importBundle(File zipFile, File root, File backupDir, boolean force, boolean dryRun) {
        if (!zipFile.isFile()) throw new GradleException("Bundle not found: ${zipFile}")
        Path rootReal = root.toPath().toRealPath()
        new ZipFile(zipFile).withCloseable { ZipFile zip ->
            List<Entry> manifest = readManifest(zip)
            Set<String> listed = manifest.collect { it.path } as Set

            // 1. Everything in the zip is listed, safe and intact — before anything is written.
            Enumeration<? extends ZipEntry> all = zip.entries()
            while (all.hasMoreElements()) {
                ZipEntry e = all.nextElement()
                if (e.isDirectory() || e.name == MANIFEST) continue
                checkedName(e.name)
                if (!listed.contains(e.name)) throw new GradleException("Bundle contains ${e.name}, which its manifest does not list")
            }
            manifest.each { Entry e ->
                ZipEntry zipEntry = zip.getEntry(e.path)
                if (zipEntry == null) throw new GradleException("Bundle is missing ${e.path}")
                String actual = hashEntry(zip, zipEntry, e.size)
                if (actual != e.sha256) throw new GradleException("Checksum mismatch for ${e.path} — the bundle is damaged")
            }

            // 2. What would change.
            List<Entry> toCreate = [], toReplace = []
            int unchanged = 0
            manifest.each { Entry e ->
                Path dest = rootReal.resolve(e.path).normalize()
                if (!dest.startsWith(rootReal)) throw new GradleException("Refusing to write outside the checkout: ${e.path}")
                if (!Files.exists(dest)) toCreate << e
                else if (Files.isRegularFile(dest) && sha256(dest) == e.sha256) unchanged++
                else toReplace << e
            }
            if (!toReplace.isEmpty() && !force) {
                println "These ${toReplace.size()} file(s) already exist with different content:"
                toReplace.take(20).each { println "  ${it.path}" }
                if (toReplace.size() > 20) println "  ... and ${toReplace.size() - 20} more"
                throw new GradleException('Nothing was written. Re-run with -Pforce=true to replace them (the old files are ' +
                    "kept in ${backupDir}), or -PdryRun=true to only look.")
            }
            if (dryRun) return [toCreate.size(), unchanged, toReplace.size()]

            // 3. Write. Each file goes to a temporary name first and is re-checked as it is written.
            manifest.each { Entry e ->
                Path dest = rootReal.resolve(e.path).normalize()
                if (toCreate.contains(e) == false && toReplace.contains(e) == false) return
                Files.createDirectories(dest.parent)
                if (!dest.parent.toRealPath().startsWith(rootReal)) {
                    throw new GradleException("Refusing to write outside the checkout (link?): ${e.path}")
                }
                Path temp = dest.resolveSibling(dest.fileName.toString() + '.import-part')
                try {
                    Files.newOutputStream(temp).withCloseable { out ->
                        if (hashEntry(zip, zip.getEntry(e.path), e.size, out) != e.sha256) {
                            throw new GradleException("Checksum mismatch while writing ${e.path}")
                        }
                    }
                    if (Files.exists(dest)) {
                        Path backup = backupDir.toPath().resolve(e.path)
                        Files.createDirectories(backup.parent)
                        Files.move(dest, backup, StandardCopyOption.REPLACE_EXISTING)
                    }
                    Files.move(temp, dest)
                } finally {
                    Files.deleteIfExists(temp)
                }
            }
            return [toCreate.size(), unchanged, toReplace.size()]
        }
    }
}

def assetsProjectRoot = {
    def custom = findProperty('assetsRoot')
    return custom ? new File(custom.toString()).canonicalFile : rootProject.projectDir
}

tasks.register('exportAssets') {
    group = 'assets'
    description = 'Zips the gitignored assets (assets/, lwjgl3 icons) with a checksum manifest: -Pout=<file> to choose the file.'
    doLast {
        File root = assetsProjectRoot()
        def stamp = new SimpleDateFormat('yyyyMMdd-HHmmss').format(new Date())
        def custom = findProperty('out')
        File out = custom ? new File(custom.toString()).absoluteFile
                          : new File(rootProject.buildDir, "asset-bundles/elderpath-assets-${stamp}.zip")
        String commit = 'unknown'
        try {
            def process = new ProcessBuilder('git', 'rev-parse', '--short', 'HEAD').directory(root).redirectErrorStream(true).start()
            def text = process.inputStream.text.trim()
            if (process.waitFor() == 0 && text) commit = text
        } catch (Exception ignored) { }
        int count = AssetBundle.export(root, out, commit)
        println "Exported ${count} files to ${out} (${(out.length() / 1048576).round(1)} MiB)"
        println "On the other machine: ./gradlew importAssets -Pzip=${out.name}"
    }
}

tasks.register('importAssets') {
    group = 'assets'
    description = 'Unpacks an asset bundle into this checkout: -Pzip=<file> [-PdryRun=true] [-Pforce=true].'
    doLast {
        def zipProperty = findProperty('zip')
        if (!zipProperty) throw new GradleException('Say which bundle to import: ./gradlew importAssets -Pzip=<file>')
        File root = assetsProjectRoot()
        def stamp = new SimpleDateFormat('yyyyMMdd-HHmmss').format(new Date())
        File backup = new File(rootProject.buildDir, "asset-import-backup/${stamp}")
        boolean dryRun = findProperty('dryRun')?.toString()?.toBoolean() ?: false
        boolean force = findProperty('force')?.toString()?.toBoolean() ?: false
        def (created, unchanged, replaced) = AssetBundle.importBundle(new File(zipProperty.toString()).absoluteFile, root, backup, force, dryRun)
        println "${dryRun ? 'Dry run (nothing written): would add' : 'Added'} ${created} new, ${unchanged} already identical, " +
            "${replaced} ${dryRun ? 'would be replaced' : 'replaced'}"
        if (replaced > 0 && !dryRun) println "Replaced files were kept in ${backup}"
    }
}
